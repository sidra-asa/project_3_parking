services:
  - type: web
    name: project-3-parking
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Run migrations manually as described in README before serving requests.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60 wsgi:app
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: BEHIND_PROXY
        value: '1'
      - key: PYTHON_VERSION
        value: '3.12.8'
