{% extends 'base.html' %}
{% block content %}
<div class="mb-4"><div class="eyebrow">ADMIN · DATABASE EXCEPTION QUERIES</div><h1 class="h2 fw-bold">停車管理待處理清單</h1><p class="text-secondary">歷史模擬快照下的未付款停車證、待收款紀錄與長時間停放車輛</p></div>
<form id="reviewForm" class="card card-body border-0 shadow-sm mb-4 d-flex flex-row flex-wrap align-items-end gap-3"><div><label for="reviewAt" class="form-label">模擬快照（台灣時間）</label><input type="datetime-local" class="form-control" id="reviewAt" value="2026-06-28T18:00"></div><button class="btn btn-primary" type="submit">查詢</button></form>
<div class="alert alert-secondary small" id="reviewNote">本頁僅讀取資料，不會自動修改停車紀錄或催繳。</div>
<div class="row g-4">
  <div class="col-12"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">有效但未付款的學年證 <span id="cPermits" class="badge text-bg-secondary"></span></h2><div class="table-responsive"><table class="table table-hover"><thead><tr><th>停車證 ID</th><th>車牌</th><th>車主</th><th>學年度</th><th>金額</th></tr></thead><tbody id="unpaidPermits"></tbody></table></div></div></div></div>
  <div class="col-12"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">已離場但未付款的臨停 <span id="cRecords" class="badge text-bg-secondary"></span></h2><div class="table-responsive"><table class="table table-hover"><thead><tr><th>紀錄 ID</th><th>車牌</th><th>停車區</th><th>離場</th><th>費用</th></tr></thead><tbody id="unpaidRecords"></tbody></table></div></div></div></div>
  <div class="col-12"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5">已停超過 36 小時 <span id="cLong" class="badge text-bg-secondary"></span></h2><div class="table-responsive"><table class="table table-hover"><thead><tr><th>紀錄 ID</th><th>車牌</th><th>停車區</th><th>進場</th><th>已停時數</th></tr></thead><tbody id="longStays"></tbody></table></div></div></div></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static',filename='js/management_review.js') }}"></script>{% endblock %}
