{% extends 'base.html' %}
{% block content %}
<div class="mb-4"><h1 class="h2 fw-bold mb-2">異常與待辦查詢</h1><p class="text-secondary mb-0">查看指定時間點尚未付款或停放時間較長的模擬紀錄，並前往相關資料頁查詢。</p></div>
<form id="reviewForm" class="card card-body border-0 shadow-sm mb-4 d-flex flex-row flex-wrap align-items-end gap-3"><div><label for="reviewAt" class="form-label">歷史查詢時間（台灣時間）</label><input type="datetime-local" class="form-control" id="reviewAt" value="2026-06-28T18:00" required></div><button class="btn btn-primary" type="submit">更新查詢</button></form>
<div class="alert alert-secondary small" id="reviewNote" role="status">這是歷史模擬快照，查詢本身不會修改紀錄或觸發催繳。</div>
<div class="row g-4">
  <div class="col-12"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5 fw-bold">有效但未付款的學年度停車證 <span id="cPermits" class="badge text-bg-secondary"></span></h2><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>車牌</th><th>車主</th><th>學年度</th><th>金額</th><th>停車證編號</th><th>查看</th></tr></thead><tbody id="unpaidPermits"></tbody></table></div></div></div></div>
  <div class="col-12"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5 fw-bold">已離場、尚未付款的臨停 <span id="cRecords" class="badge text-bg-secondary"></span></h2><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>車牌</th><th>停車區</th><th>離場時間</th><th>費用</th><th>紀錄編號</th><th>查看</th></tr></thead><tbody id="unpaidRecords"></tbody></table></div></div></div></div>
  <div class="col-12"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5 fw-bold">已停放超過 36 小時 <span id="cLong" class="badge text-bg-secondary"></span></h2><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>車牌</th><th>停車區</th><th>進場時間</th><th>停放時數</th><th>紀錄編號</th><th>查看</th></tr></thead><tbody id="longStays"></tbody></table></div></div></div></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static',filename='js/management_review.js') }}"></script>{% endblock %}
